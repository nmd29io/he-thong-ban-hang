name: Supabase validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: deno check --config supabase/functions/create-order/deno.json supabase/functions/create-order/index.ts
      - run: deno check --config supabase/functions/manage-operations/deno.json supabase/functions/manage-operations/index.ts
      - run: deno check --config supabase/functions/manage-members/deno.json supabase/functions/manage-members/index.ts
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase test db --local supabase/tests/sales_mvp.sql
